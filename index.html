<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button id="newbutton">New Game</button>
      </div>
    <main>
        <div class="container"></div>
        <h1 class="title">TIC-TAC-TOE</h1>
            <div>
                <div class="rules-container">
                    <h2 class="rules-title">X'S AND O'S RULES</h2>
                    <ul class="rules-list">
                      <li>Find an opponent and determine who goes first</li>
                      <li>One player plays X's and the other plays O's</li>
                      <li>Players take turns marking a space in a 3x3 grid</li>
                      <li>The player that places 3 of their marks in a row wins</li>
                    </ul>
                  </div>                
            </div>
            <div class="game">
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
              <button class="box"></button>
            </div>
        </div>
        <button id="resetbutton"> Reset Game</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
